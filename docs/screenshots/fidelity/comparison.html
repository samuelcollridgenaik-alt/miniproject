<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Cognify reference comparison</title
  ><style>
    body {
      margin: 24px;
      background: #181818;
      color: #ededed;
      font: 14px system-ui;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    figure {
      margin: 0;
    }
    img {
      width: 100%;
      height: auto;
      border: 1px solid #444;
    }
    figcaption {
      margin: 10px 0;
    }
    p {
      color: #aaa;
    }
  </style>
  <h1>Reference comparison — 1366 × 704</h1>
  <p>
    Provided annotated Codex reference and actual Cognify capture. Academic
    content differs. Annotation borders and native desktop chrome are excluded
    from the implementation.
  </p>
  <main>
    <figure>
      <figcaption>Provided Codex reference</figcaption>
      <img src="codex-reference.png" alt="User supplied Codex reference" />
    </figure>
    <figure>
      <figcaption>Cognify actual conversation</figcaption>
      <img src="conversation-desktop.png" alt="Actual Cognify conversation" />
    </figure>
    <figure>
      <figcaption>Original Cognify before reference</figcaption>
      <img src="cognify-before.png" alt="Original Cognify before redesign" />
    </figure>
    <figure>
      <figcaption>Cognify empty conversation</figcaption>
      <img
        src="workspace-desktop.png"
        alt="Actual Cognify empty conversation"
      />
    </figure>
  </main>
</html>
